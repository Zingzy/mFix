name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Read the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH, which CFBundleVersion needs."
            exit 1
          fi
          echo "MFIX_VERSION=$version" >> "$GITHUB_ENV"
      - name: Import the signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT_P12" ]; then
            echo "No SIGNING_CERT_P12 secret, so the app is signed ad hoc."
            exit 0
          fi
          scripts/import-cert.sh "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build the app and the disk image
        run: scripts/dmg.sh
      - name: Name the assets and write checksums
        run: |
          mkdir dist
          cp build/mFix.dmg dist/mFix.dmg
          ditto -c -k --keepParent build/mFix.app dist/mFix.zip
          cd dist
          shasum -a 256 mFix.dmg mFix.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "mFix $MFIX_VERSION" \
            dist/mFix.dmg dist/mFix.zip dist/SHA256SUMS.txt
      - name: Remove the signing keychain
        if: always() && env.MFIX_KEYCHAIN != ''
        run: security delete-keychain "$MFIX_KEYCHAIN"
